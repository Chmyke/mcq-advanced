[package]
name = "mcq-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
web = ["dioxus/web", "getrandom/wasm_js", "dep:web-sys"]
desktop = ["dioxus/desktop"]

[dependencies]
mcq-model.workspace = true
mcq-format.workspace = true
mcq-crypto.workspace = true
mcq-engine.workspace = true
mcq-highlight.workspace = true
mcq-edit.workspace = true
mcq-publish.workspace = true
mcq-analysis.workspace = true
mcq-grade.workspace = true
# The student look, reused as is for the preview: same rendering, same stylesheet.
mcq-player = { path = "../mcq-player" }
dioxus = { version = "0.7", default-features = false, features = ["launch", "html", "signals", "hooks", "macro", "document"] }
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
# PITFALL: see apps/mcq-player/Cargo.toml (dioxus-web 0.7.10 needs web-sys's `Location`).
web-sys = { version = "0.3", optional = true, default-features = false, features = ["Location"] }

[dev-dependencies]
dioxus-ssr = "0.7"

[lints]
workspace = true
