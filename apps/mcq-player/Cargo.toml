[package]
name = "mcq-player"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
web = ["dioxus/web", "getrandom/wasm_js", "dep:web-sys"]
desktop = ["dioxus/desktop"]

[dependencies]
mcq-model.workspace = true
mcq-format.workspace = true
mcq-grade.workspace = true
mcq-crypto.workspace = true
mcq-engine.workspace = true
mcq-math.workspace = true
dioxus = { version = "0.7", default-features = false, features = ["launch", "html", "signals", "hooks", "macro", "document"] }
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# PITFALL: dioxus-web 0.7.10 calls `Window::location` without enabling web-sys's `Location`
# feature; Cargo unifies features, so enabling it here lets dioxus-web compile.
web-sys = { version = "0.3", optional = true, default-features = false, features = ["Location"] }

[build-dependencies]
# The icon and name of the Windows program (build.rs); nothing of it ships in the program.
winresource = "0.1"

[dev-dependencies]
dioxus-ssr = "0.7"
mcq-highlight.workspace = true
mcq-publish.workspace = true

[lints]
workspace = true
