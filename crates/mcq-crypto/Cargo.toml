[package]
name = "mcq-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mcq-model.workspace = true
mcq-format.workspace = true
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha", "hkdfsha2"] }
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[lints]
workspace = true
