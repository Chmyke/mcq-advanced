# Checks every change on GitHub's machines. Windows runs the repository's single check
# (tools/check.ps1: format, lints, tests, WebAssembly builds, layout in a real browser). Linux
# lints and tests the desktop build, checks that both programs start, and packs them into
# mcq-advanced-<version>-linux-x86_64.tar.gz with its SHA-256 line: tools/fetch-linux.ps1 takes
# that archive from the run of the commit being released.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The release self-test looks up the commit that set the version: it needs the history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      # The private fingerprint list and the local corpus are absent here: check.ps1 runs the
      # structural content rules only, as it says.
      - name: Check
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check.ps1

  linux:
    name: Linux
    # The oldest supported runner: its glibc and WebKitGTK set the oldest systems the archive runs on.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked --features mcq-player/desktop,mcq-studio/desktop -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p mcq-player -p mcq-studio --features desktop
      - name: Both programs start
        run: |
          for app in mcq-player mcq-studio; do
            status=0
            timeout 15 xvfb-run -a "target/release/$app" || status=$?
            # 124: still running when stopped, as a window should be.
            if [ "$status" -ne 124 ]; then echo "$app exited with $status"; exit 1; fi
          done
      - name: Pack
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          name="mcq-advanced-$version-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/mcq-studio target/release/mcq-player "dist/$name/"
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/README.txt packaging/linux/THIRD-PARTY-NOTICES.txt "dist/$name/"
          cp LICENSE "dist/$name/LICENSE.txt"
          mkdir "dist/$name/icons"
          cp packaging/icons/mcq-advanced-256.png "dist/$name/icons/mcq-advanced.png"
          cp packaging/icons/mcq-advanced.svg "dist/$name/icons/mcq-advanced.svg"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" | awk '{ print toupper($1) "  " $2 }' > SHA256-linux.txt)
          cat dist/SHA256-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256-linux.txt
          retention-days: 30
