[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Chmyke/mcq-advanced"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
mcq-model = { path = "crates/mcq-model" }
mcq-format = { path = "crates/mcq-format" }
mcq-grade = { path = "crates/mcq-grade" }
mcq-lint = { path = "crates/mcq-lint" }
mcq-crypto = { path = "crates/mcq-crypto" }
mcq-engine = { path = "crates/mcq-engine" }
mcq-highlight = { path = "crates/mcq-highlight" }
mcq-edit = { path = "crates/mcq-edit" }
mcq-publish = { path = "crates/mcq-publish" }
mcq-analysis = { path = "crates/mcq-analysis" }

# Cryptography is slow without optimisation; dependencies are optimised even in tests.
[profile.dev.package."*"]
opt-level = 2
